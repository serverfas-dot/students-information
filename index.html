const getCurrentYear = (years) => {
  const now = String(new Date().getFullYear());
  if (years.includes(now)) return now;
  // Pick nearest year to current
  const sorted = [...years].sort();
  for (const y of sorted) { if (y >= now) return y; }
  return sorted[sorted.length - 1] || now;
};

const Toast = ({msg,type,onClose}) => {
  React.useEffect(()=>{const t=setTimeout(onClose,5000);return()=>clearTimeout(t)},[]);
  return <div className={`toast toast-${type}`}><div className="toast-dot"/><span style={{wordBreak:'break-word'}}>{msg}</span></div>;

// ── CSV Export helper ────────────────────────────────────
const exportStudentsCSV = (students, filename) => {
  const headers = ['Index Number','Full Name','National ID','Date of Birth','Gender','Grade / Class','Club','House','Email','Phone','Parent / Guardian','Address','Academic Year','Photo URL'];
  const escape  = v => { const s=String(v||''); return s.includes(',')||s.includes('"')||s.includes('\n') ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const rows    = students.map(s=>[s.indexNo,s.name,s.idNo,s.dob,s.gender,s.grade,s.club,s.house,s.email,s.phone,s.parentName,s.address,s.academicYear,s.photoUrl].map(escape).join(','));
  const csv     = [headers.join(','), ...rows].join('\n');
  const blob    = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
};

// ── Category Create/Edit Modal ───────────────────────────
const CatModal = ({type,item,fbNode,onClose,showToast}) => {
  const isEdit = !!item;
  const label  = type==='classes'?'Class':type==='clubs'?'Club':'House';
  const accent = type==='classes'?'#059669':type==='clubs'?'#7c3aed':'#dc2626';
  const lightBg= type==='classes'?'#ecfdf5':type==='clubs'?'#f5f3ff':'#fef2f2';
  const lightBd= type==='classes'?'#a7f3d0':type==='clubs'?'#ddd6fe':'#fecaca';

  const [name,   setName]   = React.useState(item?.name||'');
  const [teachers,setTeach] = React.useState(
    item?.teachers ? Object.entries(item.teachers).map(([k,v])=>({key:k,name:v.name||'',role:v.role||'Teacher'})) : []
  );
  const [tName,  setTN]     = React.useState('');
  const [tRole,  setTR]     = React.useState('');
  const [saving, setSaving] = React.useState(false);

  const addTeacherToList = () => {
    if(!tName.trim()) return;
    setTeach(p=>[...p,{key:'new_'+Date.now(),name:tName.trim(),role:tRole.trim()||'Teacher'}]);
    setTN(''); setTR('');
  };
  const removeFromList = key => setTeach(p=>p.filter(t=>t.key!==key));

  const save = async e => {
    e.preventDefault();
    if(!name.trim()) return;
    setSaving(true);
    try {
      if(isEdit) {
        await fbPUT(`${fbNode}/${item.id}/name`, name.trim());
        await fbDEL(`${fbNode}/${item.id}/teachers`);
        for(const t of teachers) {
          await fbPOST(`${fbNode}/${item.id}/teachers`,{name:t.name,role:t.role});
        }
        showToast(`${label} updated`,'success');
      } else {
        const id = await fbPOST(fbNode, {name:name.trim()});
        for(const t of teachers) {
          await fbPOST(`${fbNode}/${id}/teachers`,{name:t.name,role:t.role});
        }
        showToast(`${label} created`,'success');
      }
      onClose();
    } catch(e){ showToast('Save failed','error'); }
    setSaving(false);
  };

  return <div className="modal-bg">
    <div className="create-modal">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}}>
        <div>
          <h3 style={{fontSize:'1.2rem',fontWeight:900,color:'#0f172a'}}>{isEdit?'Edit':'Create'} {label}</h3>
          <p style={{fontSize:'.72rem',color:'#94a3b8',marginTop:'.15rem'}}>Add name and assign as many teachers as needed</p>
        </div>
        <button className="btn-icon btn-ghost" onClick={onClose}><Ic.X/></button>
      </div>
      <form onSubmit={save}>
        <div style={{marginBottom:'1.25rem'}}>
          <label className="lbl">{label} Name</label>
          <input className="inp" value={name} onChange={e=>setName(e.target.value)}
            placeholder={`e.g. ${type==='classes'?'Grade 7A':type==='clubs'?'Science Club':'Blue House'}…`} required/>
        </div>
        <div style={{marginBottom:'1rem'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.625rem'}}>
            <label className="lbl" style={{margin:0}}>Teachers Assigned</label>
            <span style={{fontSize:'.65rem',fontWeight:700,color:'#94a3b8'}}>{teachers.length} teacher{teachers.length!==1?'s':''}</span>
          </div>
          {teachers.length>0 && <div style={{marginBottom:'.75rem'}}>
            {teachers.map(t=>(
              <div key={t.key} className="teacher-entry">
                <div style={{width:'1.75rem',height:'1.75rem',background:lightBg,border:`1px solid ${lightBd}`,borderRadius:'.375rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <Ic.User s={12}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:'.82rem',color:'#0f172a'}}>{t.name}</div>
                  <div style={{fontSize:'.62rem',fontWeight:700,color:accent}}>{t.role}</div>
                </div>
                <button type="button" className="btn-icon btn-del" onClick={()=>removeFromList(t.key)}
                  style={{width:'1.6rem',height:'1.6rem'}}><Ic.X s={12}/></button>
              </div>
            ))}
          </div>}
          <div style={{background:'#f8fafc',border:'1.5px dashed #e2e8f0',borderRadius:'.875rem',padding:'.875rem'}}>
            <div style={{fontSize:'.65rem',fontWeight:800,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'.5rem'}}>Add Teacher</div>
            <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
              <input className="inp" value={tName} onChange={e=>setTN(e.target.value)}
                placeholder="Teacher full name…"
                onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addTeacherToList();}}}
                style={{flex:2,minWidth:'140px'}}/>
              <input className="inp" value={tRole} onChange={e=>setTR(e.target.value)}
                placeholder="Role (e.g. Head Teacher)…"
                onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addTeacherToList();}}}
                style={{flex:2,minWidth:'140px'}}/>
              <button type="button" className="btn btn-emerald"
                onClick={addTeacherToList} disabled={!tName.trim()}
                style={{height:'46px',whiteSpace:'nowrap',opacity:tName.trim()?1:.5}}>
                <Ic.Plus s={14}/>Add
              </button>
            </div>
            <div style={{fontSize:'.62rem',color:'#94a3b8',marginTop:'.375rem'}}>Press Enter or click Add</div>
          </div>
        </div>
        <div style={{display:'flex',gap:'.625rem',marginTop:'1.25rem'}}>
          <button type="button" className="btn btn-ghost w-full" style={{justifyContent:'center',padding:'.8rem'}} onClick={onClose}>Cancel</button>
          <button type="submit" className="btn w-full" disabled={saving||!name.trim()}
            style={{justifyContent:'center',padding:'.8rem',background:accent,color:'white',opacity:(!name.trim()||saving)?0.6:1}}>
            {saving?<><Ic.Sync s={14} spin/>{isEdit?'Saving…':'Creating…'}</>:<><Ic.Check s={14}/>{isEdit?'Save Changes':'Create '+label}</>}
          </button>
        </div>
      </form>
    </div>
  </div>;
};

// ── Category Card ────────────────────────────────────────
const CatCard = ({item,type,fbNode,onDelete,showToast}) => {
  const [open,   setOpen]   = React.useState(false);
  const [editing,setEditing]= React.useState(false);
  const [addingT,setAddingT]= React.useState(false);
  const [tName,  setTN]     = React.useState('');
  const [tRole,  setTR]     = React.useState('');
  const [saving, setSaving] = React.useState(false);

  const accent  = type==='classes'?'#059669':type==='clubs'?'#7c3aed':'#dc2626';
  const lightBg = type==='classes'?'#ecfdf5':type==='clubs'?'#f5f3ff':'#fef2f2';

  const teachers = item.teachers ? Object.entries(item.teachers) : [];

  const addTeacher = async () => {
    if(!tName.trim()) return;
    setSaving(true);
    await fbPOST(`${fbNode}/${item.id}/teachers`,{name:tName.trim(),role:tRole.trim()||'Teacher'});
    setTN(''); setTR(''); setAddingT(false);
    showToast('Teacher added','success');

  const removeTeacher = async tk => {
    await fbDEL(`${fbNode}/${item.id}/teachers/${tk}`);
    showToast('Teacher removed','success');
  };

  return <>
    {editing && <CatModal type={type} item={item} fbNode={fbNode} onClose={()=>setEditing(false)} showToast={showToast}/>}
    <div className="cat-card">
      <div className="cat-header" onClick={()=>setOpen(!open)}>

          {item.name.charAt(0).toUpperCase()}

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:900,color:'#0f172a',fontSize:'.9rem'}}>{item.name}</div>
          <div style={{fontSize:'.62rem',fontWeight:700,color:'#94a3b8',marginTop:'.1rem'}}>

          </div>
        </div>
        <div style={{display:'flex',gap:'.3rem'}} onClick={e=>e.stopPropagation()}>
          <button className="btn-icon btn-edit" title="Edit" onClick={()=>setEditing(true)}><Ic.Edit/></button>
          <button className="btn-icon btn-del" title="Delete" onClick={onDelete}><Ic.Trash/></button>
        </div>
      </div>
      {open && <div className="cat-body">
        {teachers.length===0
          ? <div style={{textAlign:'center',padding:'.875rem',color:'#cbd5e1',fontWeight:800,fontSize:'.68rem',textTransform:'uppercase',letterSpacing:'.08em'}}>No teachers assigned yet</div>
          : teachers.map(([tk,tv])=>(
              <div key={tk} className="teacher-row">
                <div style={{width:'1.875rem',height:'1.875rem',background:lightBg,border:`1px solid ${lightBd}`,borderRadius:'.4rem',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <Ic.User s={13}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,color:'#0f172a',fontSize:'.82rem'}}>{tv.name}</div>
                  <div style={{fontSize:'.62rem',fontWeight:700,color:accent}}>{tv.role||'Teacher'}</div>
                </div>
                <button className="btn-icon btn-del" style={{width:'1.6rem',height:'1.6rem'}} onClick={()=>removeTeacher(tk)}><Ic.X s={11}/></button>
              </div>
            ))
        }
        {addingT
          ? <div style={{marginTop:'.625rem',background:'white',border:'1px solid #e2e8f0',borderRadius:'.875rem',padding:'.875rem'}}>
              <div style={{fontSize:'.65rem',fontWeight:800,color:'#94a3b8',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'.5rem'}}>Add Teacher</div>
              <div style={{display:'flex',gap:'.4rem',flexWrap:'wrap',marginBottom:'.4rem'}}>
                <input className="inp" value={tName} onChange={e=>setTN(e.target.value)} placeholder="Teacher name…" style={{flex:2,minWidth:'130px'}}/>
                <input className="inp" value={tRole} onChange={e=>setTR(e.target.value)} placeholder="Role…" style={{flex:2,minWidth:'130px'}}/>
              </div>
              <div style={{display:'flex',gap:'.4rem'}}>
                <button className="btn btn-emerald btn-sm" onClick={addTeacher} disabled={!tName.trim()||saving}>
                  {saving?<Ic.Sync s={12} spin/>:<Ic.Check s={12}/>}{saving?'Adding…':'Add Teacher'}
                </button>
                <button className="btn btn-ghost btn-sm" onClick={()=>{setAddingT(false);setTN('');setTR('');}}>Cancel</button>

              style={{marginTop:'.625rem',width:'100%',padding:'.55rem',background:lightBg,border:`1.5px dashed ${lightBd}`,borderRadius:'.75rem',color:accent,fontWeight:800,fontSize:'.72rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'.3rem'}}>
              <Ic.Plus s={13}/>Add Teacher
            </button>
        }
      </div>}
    </div>
  </>;

const CategorySummaryCards = ({students, selYear, grades, clubs, houses, showToast}) => {
  const [activeType, setActiveType] = React.useState('classes');
  const [viewMode,   setViewMode]   = React.useState('grid'); // 'grid' | 'list'
  const [expanded,   setExpanded]   = React.useState({}); // {name: bool} — list rows expanded

  const byYear = students.filter(s=>String(s.academicYear)===String(selYear));

  const types = [
    {id:'classes', label:'Classes', list:grades, field:'grade', accent:'#059669', bg:'#ecfdf5', bd:'#a7f3d0', lightAccent:'#d1fae5'},
    {id:'clubs',   label:'Clubs',   list:clubs,  field:'club',  accent:'#7c3aed', bg:'#f5f3ff', bd:'#ddd6fe', lightAccent:'#ede9fe'},
    {id:'houses',  label:'Houses',  list:houses, field:'house', accent:'#dc2626', bg:'#fef2f2', bd:'#fecaca', lightAccent:'#fee2e2'},
  ];

  const active = types.find(t=>t.id===activeType);

  const counts = React.useMemo(()=>{
    const map = {};
    byYear.forEach(s=>{
      const val = s[active.field];
      if(val) { if(!map[val]) map[val]={total:0,boys:0,girls:0,students:[]}; map[val].total++; if(s.gender==='Male') map[val].boys++; else map[val].girls++; map[val].students.push(s); }
    });
    return map;
  },[byYear, active]);

  const doDownloadCat = (e, catName, studsInCat) => {
    e.stopPropagation();
    if(!studsInCat.length){ showToast(`No students in ${catName}`,'error'); return; }
    const safeName = catName.replace(/[^a-z0-9]/gi,'_');
    exportStudentsCSV(studsInCat, `${activeType}_${safeName}_${selYear}.csv`);
    showToast(`Downloaded ${studsInCat.length} students — ${catName}`,'success');
  };

  const doDownloadAll = () => {
    if(!active.list.length){ showToast(`No ${active.label} to export`,'error'); return; }
    let count=0;
    active.list.forEach(item => {
      const studs = byYear.filter(s=>s[active.field]===item.name);
      if(studs.length) { const safeName=item.name.replace(/[^a-z0-9]/gi,'_'); exportStudentsCSV(studs,`${activeType}_${safeName}_${selYear}.csv`); count++; }
    });
    showToast(`Downloaded ${count} separate CSV files`,'success');
  };

  const toggleExpand = name => setExpanded(p=>({...p,[name]:!p[name]}));

  // ── Grid item ──
  const GridCard = ({item}) => {
    const c = counts[item.name]||{total:0,boys:0,girls:0,students:[]};
    const teachers = item.teachers ? Object.values(item.teachers) : [];

    return <div className="cat-summary-card" style={{background:active.bg,borderColor:active.bd,color:active.accent,userSelect:'none'}}>
      {/* Stat bar across bottom */}

        <div style={{height:'100%',width:c.total>0?`${Math.round(c.boys/c.total*100)}%`:'0%',background:active.accent,transition:'width .4s'}}/>
      </div>

        <div style={{width:'2rem',height:'2rem',borderRadius:'.5rem',background:active.lightAccent||active.bd,border:`1px solid ${active.bd}`,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:'1rem',color:active.accent,flexShrink:0}}>

        <span style={{fontSize:'.65rem',fontWeight:700,color:'#94a3b8'}}>students</span>

        <span style={{fontSize:'.62rem',fontWeight:800,color:'#1d4ed8',background:'#eff6ff',padding:'.1rem .4rem',borderRadius:'.3rem'}}>{c.boys}B</span>
        <span style={{fontSize:'.62rem',fontWeight:800,color:'#be185d',background:'#fdf2f8',padding:'.1rem .4rem',borderRadius:'.3rem'}}>{c.girls}G</span>
      </div>
      {teacherDisplay&&<div style={{fontSize:'.6rem',fontWeight:700,color:'#64748b',marginTop:'.35rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}} title={teacherDisplay}>👤 {teacherDisplay}</div>}
    </div>;
  };

  // ── List item ──
  const ListRow = ({item}) => {
    const c = counts[item.name]||{total:0,boys:0,girls:0,students:[]};
    const teachers = item.teachers ? Object.values(item.teachers) : [];

      {/* Row header */}

        onClick={()=>toggleExpand(item.name)}>
        {/* Letter avatar */}
        <div style={{width:'2.25rem',height:'2.25rem',borderRadius:'.5rem',background:active.bg,border:`1px solid ${active.bd}`,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:'.95rem',color:active.accent,flexShrink:0}}>
          {item.name.charAt(0).toUpperCase()}
        </div>
        {/* Name + teacher */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:900,color:'#0f172a',fontSize:'.9rem'}}>{item.name}</div>
          {teachers.length>0&&<div style={{fontSize:'.62rem',fontWeight:700,color:'#94a3b8',marginTop:'.05rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>👤 {teachers.map(t=>t.name).join(', ')}</div>}

          <span style={{fontSize:'.7rem',fontWeight:800,color:'#be185d',background:'#fdf2f8',padding:'.15rem .5rem',borderRadius:'.375rem'}}>{c.girls}G</span>

// ── CSV Upload & Restore ─────────────────────────────────
const CsvUpload = ({years,grades,clubs,houses,onImport,showToast}) => {
  const [dragging,setDrag]  = React.useState(false);
  const [preview, setPrev]  = React.useState(null);
  const [selYear, setSelY]  = React.useState('');
  const [saving,  setSaving]= React.useState(false);
  const [progress,setProg]  = React.useState(0);
  const fileRef = React.useRef();

  const CSV_FIELDS = [
    {key:'indexNo',label:'Index Number',required:true},{key:'name',label:'Full Name',required:true},
    {key:'idNo',label:'National ID'},{key:'dob',label:'Date of Birth'},{key:'gender',label:'Gender'},
    {key:'grade',label:'Grade / Class'},{key:'club',label:'Club'},{key:'house',label:'House'},
    {key:'email',label:'Email'},{key:'phone',label:'Phone'},{key:'parentName',label:'Parent / Guardian'},
    {key:'address',label:'Address'},{key:'academicYear',label:'Academic Year'},{key:'photoUrl',label:'Photo URL'},
  ];

  const parseCSV = text => {
    const lines = text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length < 2) return null;
    const delim = lines[0].includes('\t') ? '\t' : ',';
    const parseRow = row => {
      const r=[]; let cur='', inQ=false;
      for(let i=0;i<row.length;i++){
        const c=row[i];
        if(c==='"'){inQ=!inQ;}
        else if(c===delim&&!inQ){r.push(cur.trim());cur='';}
        else cur+=c;
      }
      r.push(cur.trim());
      return r;
    };
    const headers = parseRow(lines[0]).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,' ').trim());
    const rows = [];
    for(let i=1;i<lines.length;i++){
      const vals = parseRow(lines[i]);
      if(vals.every(v=>!v.trim())) continue;
      const obj={};
      headers.forEach((h,j)=>{obj[h]=vals[j]||'';});
      rows.push(obj);
    }
    return {headers, rows};
  };

  const HMAP2 = {
    'name':'name','full name':'name','student name':'name','fullname':'name',
    'index':'indexNo','index no':'indexNo','indexno':'indexNo','index number':'indexNo','student id':'indexNo','idx':'indexNo',
    'id':'idNo','id no':'idNo','idno':'idNo','nic':'idNo','national id':'idNo','reg no':'idNo','registration':'idNo',
    'dob':'dob','date of birth':'dob','birthdate':'dob','birth date':'dob','birthday':'dob',
    'gender':'gender','sex':'gender',
    'grade':'grade','class':'grade','level':'grade','form':'grade','classroom':'grade','grade class':'grade',
    'club':'club','society':'club','activity':'club',
    'house':'house','team':'house','dormitory':'house',
    'email':'email','email address':'email','e mail':'email',
    'phone':'phone','mobile':'phone','contact':'phone','phone number':'phone','tel':'phone',
    'parent':'parentName','guardian':'parentName','parent name':'parentName','parent guardian':'parentName',
    'address':'address','permanent address':'address','home address':'address',
    'academic year':'academicYear','academicyear':'academicYear','year':'academicYear','intake':'academicYear','batch':'academicYear',
    'photo':'photoUrl','photo url':'photoUrl','image':'photoUrl','picture':'photoUrl',
  };

  const mapRow = (row, fallbackYear) => {
    const s={name:'',indexNo:'',idNo:'',dob:'',gender:'Male',grade:'',club:'',house:'',email:'',phone:'',parentName:'',address:'',academicYear:fallbackYear,photoUrl:''};
    Object.entries(row).forEach(([h,v])=>{
      const val = String(v||'').trim();
      if(!val) return;
      if(HMAP2[h]){ s[HMAP2[h]]=val; return; }
      for(const [key,field] of Object.entries(HMAP2)){
        if(h.includes(key)||key.includes(h)){s[field]=val;break;}
      }
    });
    const g=(s.gender||'').toLowerCase();
    if(g==='m'||g==='1'||g.startsWith('m')) s.gender='Male';
    else if(g==='f'||g==='2'||g.startsWith('f')) s.gender='Female';
    else if(!g) s.gender='Male';
    if(!s.academicYear) s.academicYear=fallbackYear;
    if(!s.photoUrl&&s.name) s.photoUrl=`https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=random&size=256`;
    return s;
  };

  const handleFile = file => {
    if(!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if(!['csv','txt'].includes(ext)){ showToast('Please upload a CSV file','error'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const parsed = parseCSV(e.target.result);
      if(!parsed||parsed.rows.length===0){ showToast('CSV is empty or invalid','error'); return; }
      const year = selYear||years[0]||'2025';
      const mapped = parsed.rows.map(r=>mapRow(r,year)).filter(s=>s.name&&s.indexNo);
      setPrev({headers:parsed.headers, rows:mapped, total:parsed.rows.length, valid:mapped.length, year});
    };
    reader.readAsText(file);
  };

  const doImport = async () => {
    if(!preview||!preview.rows.length) return;
    setSaving(true); setProg(0);
    try {
      await onImport(preview.rows, preview.year, p=>setProg(p));
      showToast(`✓ ${preview.rows.length} students saved to Firebase (${preview.year})`,'success');
      setPrev(null); setSelY('');
    }catch(e){showToast('Import failed: '+e.message,'error');}
    setSaving(false); setProg(0);
  };

  const downloadTemplate = () => {
    const headers = CSV_FIELDS.map(f=>f.label).join(',');
    const sample  = 'STD/25/001,Ahmed Ali,A123456,2010-05-15,Male,Grade 7,Science Club,Blue House,ahmed@school.edu,+960 777 1234,Ahmed Senior,Male Atoll,2025,';
    const blob = new Blob([headers+'\n'+sample],{type:'text/csv'});
    const u=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=u;a.download='student_template.csv';a.click();URL.revokeObjectURL(u);
    showToast('Template downloaded','success');
  };

  return <div style={{marginTop:'1rem',paddingTop:'1rem',borderTop:'1px solid #a7f3d0'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.75rem',flexWrap:'wrap',gap:'.5rem'}}>
      <div>
        <div style={{fontWeight:900,color:'#0f172a',fontSize:'.875rem'}}>📂 CSV Upload & Restore</div>
        <div style={{fontSize:'.65rem',color:'#64748b'}}>Upload CSV to import students — separate by academic year</div>
      </div>
      <button onClick={downloadTemplate} style={{background:'#eff6ff',color:'#1d4ed8',border:'1px solid #bfdbfe',borderRadius:'.625rem',padding:'.4rem .875rem',fontWeight:800,fontSize:'.72rem',cursor:'pointer',display:'flex',alignItems:'center',gap:'.3rem'}}>
        <Ic.Download s={12}/>Template
      </button>
    </div>
    <div style={{marginBottom:'.625rem'}}>
      <label className="lbl">Academic Year for this upload</label>
      <select className="inp" value={selYear} onChange={e=>{setSelY(e.target.value);setPrev(null);}} style={{cursor:'pointer'}}>
        <option value="">Select year…</option>
        {years.map(y=><option key={y} value={y}>{y}</option>)}
      </select>
    </div>
    {selYear && <div
      onDragOver={e=>{e.preventDefault();setDrag(true);}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0]);}}
      onClick={()=>fileRef.current?.click()}
      style={{border:`2px dashed ${dragging?'#4f46e5':'#a7f3d0'}`,borderRadius:'1rem',padding:'1.5rem',textAlign:'center',cursor:'pointer',background:dragging?'#eef2ff':'#f0fdf4',transition:'all .2s',marginBottom:'.625rem'}}>
      <div style={{fontSize:'1.5rem',marginBottom:'.375rem'}}>📊</div>
      <div style={{fontWeight:800,color:'#047857',fontSize:'.82rem'}}>Drop CSV here or click to browse</div>
      <div style={{fontSize:'.68rem',color:'#64748b',marginTop:'.2rem'}}>Will import as <strong>{selYear}</strong> students</div>
      <input ref={fileRef} type="file" accept=".csv,.txt" className="hidden" onChange={e=>handleFile(e.target.files?.[0])}/>
    </div>}
    {preview && <div style={{background:'white',border:'1px solid #e2e8f0',borderRadius:'1rem',padding:'1rem',marginBottom:'.625rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.75rem',flexWrap:'wrap',gap:'.5rem'}}>
        <div>
          <div style={{fontWeight:900,color:'#0f172a',fontSize:'.875rem'}}>Preview — {preview.year}</div>
          <div style={{fontSize:'.68rem',color:'#64748b'}}>{preview.valid} valid students ({preview.total} rows in file)</div>
        </div>
        <button onClick={()=>setPrev(null)} style={{background:'#fef2f2',color:'#dc2626',border:'none',borderRadius:'.5rem',padding:'.3rem .625rem',fontWeight:800,fontSize:'.72rem',cursor:'pointer'}}>Clear</button>
      </div>
      <div style={{overflowX:'auto',marginBottom:'.75rem'}}>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:'.72rem',minWidth:'700px'}}>
          <thead><tr style={{background:'#f1f5f9'}}>
            {['Index No','Full Name','ID','Gender','Grade','Club','House','Phone','Year'].map(h=><th key={h} style={{padding:'.35rem .625rem',textAlign:'left',fontWeight:800,color:'#475569',textTransform:'uppercase',fontSize:'.6rem',letterSpacing:'.06em',whiteSpace:'nowrap'}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {preview.rows.slice(0,8).map((s,i)=><tr key={i} style={{borderTop:'1px solid #f1f5f9'}}>
              <td style={{padding:'.35rem .625rem',fontFamily:'monospace',color:'#4f46e5',fontWeight:700,whiteSpace:'nowrap'}}>{s.indexNo}</td>
              <td style={{padding:'.35rem .625rem',fontWeight:700,color:'#0f172a',whiteSpace:'nowrap'}}>{s.name}</td>
              <td style={{padding:'.35rem .625rem',color:'#64748b',whiteSpace:'nowrap'}}>{s.idNo||'—'}</td>
              <td style={{padding:'.35rem .625rem'}}><span className={`badge ${s.gender==='Male'?'badge-blue':'badge-pink'}`}>{s.gender}</span></td>
              <td style={{padding:'.35rem .625rem',whiteSpace:'nowrap'}}>{s.grade?<span className="badge badge-emerald">{s.grade}</span>:'—'}</td>
              <td style={{padding:'.35rem .625rem',whiteSpace:'nowrap'}}>{s.club?<span className="badge badge-purple">{s.club}</span>:'—'}</td>
              <td style={{padding:'.35rem .625rem',whiteSpace:'nowrap'}}>{s.house?<span className="badge badge-red">{s.house}</span>:'—'}</td>
              <td style={{padding:'.35rem .625rem',color:'#64748b',whiteSpace:'nowrap'}}>{s.phone||'—'}</td>
              <td style={{padding:'.35rem .625rem'}}><span className="badge badge-amber">{s.academicYear}</span></td>
            </tr>)}
            {preview.rows.length>8&&<tr><td colSpan={9} style={{padding:'.35rem .625rem',color:'#94a3b8',fontWeight:700,fontSize:'.65rem',textAlign:'center'}}>+{preview.rows.length-8} more students…</td></tr>}
          </tbody>
        </table>
      </div>
      {saving&&<div style={{height:'6px',background:'#e2e8f0',borderRadius:'999px',overflow:'hidden',marginBottom:'.5rem'}}><div style={{height:'100%',background:'#4f46e5',borderRadius:'999px',width:progress+'%',transition:'width .3s'}}/></div>}
      <button onClick={doImport} disabled={saving||!preview.rows.length}
        className="btn btn-indigo w-full" style={{justifyContent:'center',padding:'.75rem',fontSize:'.78rem',textTransform:'uppercase',opacity:saving?0.7:1}}>
        {saving?<><Ic.Sync s={14} spin/>Importing {Math.round(progress)}%…</>:<><Ic.Upload s={14}/>Import {preview.rows.length} Students → Firebase ({preview.year})</>}
      </button>
    </div>}
  </div>;
};

// ── Sheets Sync ──────────────────────────────────────────
const SheetsSync = ({students,isSyncing,lastSync,syncResult,onSync,onImport,years,grades,clubs,houses,showToast}) => {
  const [exportYear,setEY] = React.useState('all');

  const doExportCSV = () => {
    if(!students?.length){ showToast('No students to export','error'); return; }
    if(exportYear==='all') {
      exportStudentsCSV(students, `all_students_${new Date().toISOString().split('T')[0]}.csv`);
      showToast(`Exported ${students.length} students (all years)`,'success');
    } else if(exportYear==='separate') {
      const byYear = {};
      students.forEach(s=>{ const y=s.academicYear||'unknown'; if(!byYear[y]) byYear[y]=[]; byYear[y].push(s); });
      Object.entries(byYear).forEach(([y,arr])=>{
        exportStudentsCSV(arr, `students_${y}_${new Date().toISOString().split('T')[0]}.csv`);
      });
      showToast(`Exported ${Object.keys(byYear).length} files (one per year)`,'success');
    } else {
      const filtered = students.filter(s=>String(s.academicYear)===String(exportYear));
      if(!filtered.length){ showToast(`No students in ${exportYear}`,'error'); return; }
      exportStudentsCSV(filtered, `students_${exportYear}_${new Date().toISOString().split('T')[0]}.csv`);
      showToast(`Exported ${filtered.length} students for ${exportYear}`,'success');
    }
  };

  const yearCounts = React.useMemo(()=>{
    const c={};
    (students||[]).forEach(s=>{ const y=s.academicYear||'unknown'; c[y]=(c[y]||0)+1; });
    return c;
  },[students]);

  return <div className="sync-box">
    <div style={{display:'flex',alignItems:'center',gap:'.75rem',marginBottom:'1rem',flexWrap:'wrap'}}>
      <div style={{width:'2.5rem',height:'2.5rem',background:'#d1fae5',borderRadius:'.75rem',display:'flex',alignItems:'center',justifyContent:'center',color:'#047857'}}><Ic.Sheet s={20}/></div>
      <div>
        <div style={{fontWeight:900,color:'#0f172a',fontSize:'.9rem'}}>Data Management</div>
        <div style={{fontSize:'.66rem',color:'#64748b'}}>{students?.length||0} students in Firebase</div>
      </div>
    </div>
    <div style={{marginBottom:'1rem'}}>
      <div style={{fontWeight:800,color:'#0f172a',fontSize:'.82rem',marginBottom:'.5rem'}}>📥 Export Students to CSV</div>
      <div style={{fontSize:'.65rem',color:'#64748b',marginBottom:'.625rem'}}>
        {Object.keys(yearCounts).length>0&&Object.entries(yearCounts).map(([y,c])=>`${y}: ${c}`).join(' · ')}
      </div>
      <div style={{display:'flex',gap:'.35rem',flexWrap:'wrap',marginBottom:'.625rem'}}>
        {[
          {v:'all',l:`All Years (${students?.length||0})`},
          {v:'separate',l:'Separate Files'},
          ...Object.entries(yearCounts).map(([y,c])=>({v:y,l:`${y} (${c})`}))
        ].map(opt=>(
          <button key={opt.v} onClick={()=>setEY(opt.v)}
            style={{padding:'.3rem .75rem',borderRadius:'999px',border:`1.5px solid ${exportYear===opt.v?'#059669':'#e2e8f0'}`,background:exportYear===opt.v?'#059669':'#f8fafc',color:exportYear===opt.v?'white':'#64748b',fontWeight:800,fontSize:'.68rem',cursor:'pointer',transition:'all .14s'}}>
            {opt.l}
          </button>
        ))}
      </div>
      <button onClick={doExportCSV}
        style={{width:'100%',padding:'.7rem',background:'linear-gradient(135deg,#059669,#047857)',color:'white',border:'none',borderRadius:'.875rem',fontWeight:800,fontSize:'.75rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'.4rem',textTransform:'uppercase',letterSpacing:'.06em'}}>
        <Ic.Download s={14}/>
        {exportYear==='all'?`Download All ${students?.length||0} Students`:
         exportYear==='separate'?`Download ${Object.keys(yearCounts).length} Separate Files`:
         `Download ${yearCounts[exportYear]||0} Students (${exportYear})`}
      </button>
    </div>
    {onImport&&<CsvUpload years={years} grades={grades||[]} clubs={clubs||[]} houses={houses||[]} onImport={onImport} showToast={showToast}/>}
  </div>;
};

// ── Admin Statistics Panel ───────────────────────────────
const AdminStats = ({students, selYear, showToast}) => {
  const [editSt, setESt]  = React.useState(false);
  const [customSt,setCS]  = React.useState(null);
  const [stTmp,  setSTmp] = React.useState({total:0,boys:0,girls:0});

  const cur  = students.filter(s=>String(s.academicYear)===String(selYear));
  const live = {total:cur.length, boys:cur.filter(s=>s.gender==='Male').length, girls:cur.filter(s=>s.gender==='Female').length};
  const disp = customSt||live;

  return <div className="card-xl" style={{padding:'1.25rem',marginBottom:'1rem'}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'.5rem',marginBottom:'.875rem'}}>
      <div>
        <div style={{fontWeight:900,fontSize:'.875rem',color:'#0f172a'}}>📊 Statistics Display</div>
        <div style={{fontSize:'.65rem',color:'#94a3b8',marginTop:'.1rem'}}>
          {customSt ? 'Showing custom numbers — Student Statistics screen' : 'Showing live Firebase counts'}
        </div>
      </div>
      <div style={{display:'flex',gap:'.4rem'}}>
        {customSt&&<button onClick={async()=>{
          setCS(null);
          try{await fetch('https://studentstat-968de-default-rtdb.firebaseio.com/custom_stats.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:false})});}catch(e){}
          showToast('Reset to live statistics','success');
        }} className="btn btn-emerald btn-sm">Use Live</button>}
        <button onClick={()=>{setSTmp(disp);setESt(!editSt);}} className="btn btn-ghost btn-sm">
          {editSt?'Cancel':'Edit Stats'}
        </button>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.75rem',marginBottom:editSt?'.875rem':'0'}}>
      {[['Total Students',disp.total,'sst-i'],['Boys Enrolled',disp.boys,'sst-b'],['Girls Enrolled',disp.girls,'sst-r']].map(([l,v,c])=>(
        <div key={l} className={`sst ${c}`}>
          <span className="sst-lbl">{l}</span>
          <span className="sst-val">{v}</span>
        </div>
      ))}
    </div>
    {editSt && <div style={{borderTop:'1px solid #f1f5f9',paddingTop:'.875rem'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.75rem',marginBottom:'.75rem'}}>
        {[['Total','total'],['Boys','boys'],['Girls','girls']].map(([l,k])=>(
          <div key={k}>
            <label className="lbl">{l}</label>
            <input className="inp" type="number" min="0" value={stTmp[k]}
              onChange={e=>setSTmp({...stTmp,[k]:parseInt(e.target.value)||0})}/>
          </div>
        ))}
      </div>
      <button onClick={async()=>{
        setCS(stTmp);
        try{
          await fetch('https://studentstat-968de-default-rtdb.firebaseio.com/custom_stats.json',{
            method:'PUT',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({...stTmp,active:true,updatedAt:new Date().toISOString()})
          });
          showToast('Stats saved — Student Statistics display updated','success');
        }catch(e){showToast('Save failed','error');}
        setESt(false);
      }} className="btn btn-emerald" style={{width:'100%',justifyContent:'center',padding:'.75rem'}}>
        <Ic.Save s={14}/>Save Stats to Display
      </button>
    </div>}
  </div>;
};

// ── Admin View ───────────────────────────────────────────
const AdminView = ({students,selYear,grades,clubs,houses,years,onAdd,onUpdate,onDelete,onDeleteCat,onSetYears,onPublicView,isSyncing,lastSync,syncResult,onSync,showToast,onCsvImport}) => {
  const [tab,setTab]       = React.useState('students');
  const [modal,setModal]   = React.useState(false);
  const [editing,setEditing]= React.useState(null);
  const [form,setForm]     = React.useState({});
  const [search,setSearch] = React.useState('');
  const [sel,setSel]       = React.useState([]);
  const [conf,setConf]     = React.useState(null);
  const [yearN,setYearN]   = React.useState('');
  const [editYear,setEY]   = React.useState(null);
  const [creating,setCreating] = React.useState(null);
  const fileRef = React.useRef();

  const filtered = React.useMemo(()=>{
    let base=students.filter(s=>String(s.academicYear)===String(selYear));
    if(search.trim()){const t=search.toLowerCase();base=base.filter(s=>s.name.toLowerCase().includes(t)||s.indexNo.toLowerCase().includes(t)||(s.idNo&&s.idNo.toLowerCase().includes(t)));}
    return base;
  },[students,selYear,search]);

  // Normalize any date string to YYYY-MM-DD for HTML date input
  const normDate = v => {
    if(!v) return '';
    const s = String(v).trim();
    // Already YYYY-MM-DD
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // DD/MM/YYYY or DD-MM-YYYY
    const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(dmy) return `${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`;
    // MM/DD/YYYY
    const mdy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(mdy) return `${mdy[3]}-${mdy[1].padStart(2,'0')}-${mdy[2].padStart(2,'0')}`;
    // Try JS Date parse as fallback
    try { const d=new Date(s); if(!isNaN(d)) return d.toISOString().split('T')[0]; } catch(e){}
    return s;
  };

  const openAdd  = ()=>{setEditing(null);setForm({gender:'Male',academicYear:selYear});setModal(true);};
  const openEdit = s=>{setEditing(s);setForm({...s, dob: normDate(s.dob)});setModal(true);};

  const submitStu = e=>{
    e.preventDefault();
    const photo=form.photoUrl||`https://ui-avatars.com/api/?name=${encodeURIComponent(form.name||'S')}&background=random`;
    if(editing) onUpdate({...form,photoUrl:photo});
    else onAdd({...form,photoUrl:photo});
    setModal(false);setEditing(null);setForm({});
  };

  const submitYear = e=>{
    e.preventDefault(); const n=yearN.trim(); if(!n) return;
    if(editYear) onSetYears(years.map(y=>y===editYear?n:y));
    else onSetYears([...years,n].sort());
    setYearN('');setEY(null);
  };

  const doDelete = async ()=>{
    const c=conf; setConf(null);
    if(c.type==='bulk'){for(const id of c.ids) await onDelete(id); setSel([]);}
    else if(c.catType) await onDeleteCat(c.catType,c.id);
    else await onDelete(c.id);
  };

  const fbNode = tab==='classes'?'grades':tab==='clubs'?'clubs':'houses';
  const catList = tab==='classes'?grades:tab==='clubs'?clubs:houses;

  return <div style={{paddingBottom:'5rem'}}>
    {conf&&<ConfirmDel
      title={conf.type==='bulk'?`Delete ${conf.ids.length} Students`:'Confirm Delete'}
      msg={conf.type==='bulk'?`Delete ${conf.ids.length} students?`:`Remove "${conf.name}"? Cannot be undone.`}
      onConfirm={doDelete} onCancel={()=>setConf(null)}/>}

    {creating&&<CatModal type={creating} item={null} fbNode={creating==='classes'?'grades':creating==='clubs'?'clubs':'houses'}
      onClose={()=>setCreating(null)} showToast={showToast}/>}

    <div className="card-xl" style={{padding:'1.25rem',marginBottom:'1rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'.75rem',marginBottom:'1rem'}}>
        <div>
          <h2 style={{fontSize:'1.3rem',fontWeight:900,color:'#0f172a'}}>Admin Console</h2>
          <p style={{fontSize:'.65rem',color:'#94a3b8',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>{selYear} Academic Registry</p>
        </div>
        <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
          <button className="btn btn-emerald btn-sm" onClick={onPublicView}><Ic.Users s={14}/>Public View</button>
          <button className="btn btn-indigo btn-sm" onClick={openAdd}><Ic.Plus s={14}/>Enroll Student</button>
        </div>
      </div>
      <SheetsSync students={students} isSyncing={isSyncing} lastSync={lastSync} syncResult={syncResult} onSync={onSync} onImport={onCsvImport} years={years} grades={grades} clubs={clubs} houses={houses} showToast={showToast}/>
    </div>

    <AdminStats students={students} selYear={selYear} showToast={showToast}/>

    <div className="tab-bar" style={{marginBottom:'1rem'}}>
      {[['students','Students'],['classes','Classes'],['clubs','Clubs'],['houses','Houses'],['years','Years']].map(([id,l])=>(
        <button key={id} className={`tab-btn${tab===id?(id==='students'?' tab-indigo':' tab-emerald'):''}`}
          onClick={()=>setTab(id)}>
          {l}
        </button>
      ))}
    </div>

    {tab==='students' ? <>
      <div style={{position:'sticky',top:'60px',zIndex:50,paddingBottom:'.4rem',marginBottom:'.4rem'}}>
        <div className="card" style={{padding:'.75rem .875rem'}}>
          <div style={{marginBottom:'.5rem'}}><SearchBar value={search} onChange={setSearch} placeholder="Search name, index or ID…"/></div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'.5rem',flexWrap:'wrap'}}>
            <label style={{display:'flex',alignItems:'center',gap:'.4rem',cursor:'pointer',fontWeight:700,fontSize:'.78rem',color:'#4f46e5',userSelect:'none'}}>
              <input type="checkbox" checked={filtered.length>0&&sel.length===filtered.length}
                onChange={e=>setSel(e.target.checked?filtered.map(s=>s.id):[])}
                style={{width:'1rem',height:'1rem',accentColor:'#4f46e5',cursor:'pointer'}}/>
              {filtered.length>0&&sel.length===filtered.length?'Deselect All':'Select All'}
            </label>
            <div style={{display:'flex',alignItems:'center',gap:'.625rem'}}>
              {sel.length>0&&<button onClick={()=>setConf({type:'bulk',ids:[...sel]})}
                style={{background:'#fef2f2',color:'#dc2626',border:'1px solid #fecaca',borderRadius:'.5rem',padding:'.3rem .75rem',fontWeight:800,fontSize:'.72rem',cursor:'pointer',display:'flex',alignItems:'center',gap:'.3rem'}}>
                <Ic.Trash s={12}/>Delete {sel.length}
              </button>}
              {/* Quick per-class CSV download button in students tab */}
              {filtered.length>0&&<button
                onClick={()=>{exportStudentsCSV(filtered,`students_${selYear}_${new Date().toISOString().split('T')[0]}.csv`);showToast(`Downloaded ${filtered.length} shown students`,'success');}}
                style={{background:'#ecfdf5',color:'#047857',border:'1px solid #a7f3d0',borderRadius:'.5rem',padding:'.3rem .75rem',fontWeight:800,fontSize:'.72rem',cursor:'pointer',display:'flex',alignItems:'center',gap:'.3rem'}}>
                <Ic.Download s={12}/>CSV ({filtered.length})
              </button>}
              <span style={{fontSize:'.72rem',fontWeight:700,color:'#94a3b8'}}>{filtered.length} students</span>
            </div>
          </div>
        </div>
      </div>
      <div className="card-xl" style={{overflow:'hidden'}}>
        <div className="tbl-wrap"><table>
          <thead><tr style={{background:'#0f172a'}}>
            <th style={{color:'#64748b',width:'2.25rem'}}></th>
            <th style={{color:'#64748b'}}>Student</th>
            <th style={{color:'#64748b'}}>Index No</th>
            <th style={{color:'#64748b'}}>Grade</th>
            <th style={{color:'#64748b'}}>Club</th>
            <th style={{color:'#64748b'}}>House</th>
            <th style={{color:'#64748b'}}>Sex</th>
            <th style={{color:'#64748b',textAlign:'right',minWidth:'90px'}}>Actions</th>
          </tr></thead>
          <tbody>
            {filtered.length>0 ? filtered.map(s=>(
              <tr key={s.id} style={{background:sel.includes(s.id)?'#eef2ff':''}}>
                <td><input type="checkbox" checked={sel.includes(s.id)}
                  onChange={e=>setSel(p=>e.target.checked?[...p,s.id]:p.filter(i=>i!==s.id))}
                  style={{width:'1rem',height:'1rem',accentColor:'#4f46e5',cursor:'pointer'}}/></td>
                <td><div style={{display:'flex',alignItems:'center',gap:'.5rem'}}>
                  <img src={s.photoUrl||`https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=random`}
                    style={{width:'2rem',height:'2rem',borderRadius:'.5rem',objectFit:'cover',flexShrink:0}}/>
                  <span style={{fontWeight:800,color:'#0f172a'}}>{s.name}</span>
                </div></td>
                <td style={{fontFamily:'monospace',fontWeight:700,color:'#4f46e5',fontSize:'.82rem'}}>{s.indexNo}</td>
                <td>{s.grade?<span className="badge badge-emerald">{s.grade}</span>:<span style={{color:'#cbd5e1',fontSize:'.78rem'}}>—</span>}</td>
                <td>{s.club?<span className="badge badge-purple">{s.club}</span>:<span style={{color:'#cbd5e1',fontSize:'.78rem'}}>—</span>}</td>
                <td>{s.house?<span className="badge badge-red">{s.house}</span>:<span style={{color:'#cbd5e1',fontSize:'.78rem'}}>—</span>}</td>
                <td><span className={`badge ${s.gender==='Male'?'badge-blue':'badge-pink'}`}>{s.gender}</span></td>
                <td style={{textAlign:'right'}}>
                  <div style={{display:'inline-flex',gap:'.3rem'}}>
                    <button className="btn-icon btn-edit" onClick={()=>openEdit(s)}><Ic.Edit/></button>
                    <button className="btn-icon btn-del" onClick={()=>setConf({id:s.id,name:s.name})}><Ic.Trash/></button>
                  </div>
                </td>
              </tr>
            )) : <tr><td colSpan={8} style={{textAlign:'center',padding:'2.5rem',color:'#cbd5e1',fontWeight:800,textTransform:'uppercase',fontSize:'.72rem'}}>
              {search?'No students match':'No students enrolled for '+selYear}
            </td></tr>}
          </tbody>
        </table></div>
      </div>

    </> : tab==='years' ? <>
      <div className="card-xl" style={{padding:'1.125rem',marginBottom:'1rem'}}>
        <div style={{fontWeight:900,fontSize:'.875rem',color:'#0f172a',marginBottom:'.75rem'}}>{editYear?'Edit':'Add'} Academic Year</div>
        <form onSubmit={submitYear} style={{display:'flex',gap:'.625rem',flexWrap:'wrap',alignItems:'flex-end'}}>
          <div style={{flex:1,minWidth:'150px'}}><label className="lbl">Year</label><input className="inp" value={yearN} onChange={e=>setYearN(e.target.value)} placeholder="e.g. 2025" required/></div>
          <div style={{display:'flex',gap:'.4rem'}}>
            <button type="submit" className="btn btn-emerald btn-sm">{editYear?'Update':'Add Year'}</button>
            {editYear&&<button type="button" className="btn btn-ghost btn-sm" onClick={()=>{setEY(null);setYearN('');}}>Cancel</button>}
          </div>
        </form>
      </div>
      <div className="card-xl" style={{overflow:'hidden'}}>
        <div className="tbl-wrap"><table>
          <thead><tr style={{background:'#059669'}}><th style={{color:'white'}}>Academic Year</th><th style={{color:'white',textAlign:'right'}}>Actions</th></tr></thead>
          <tbody>
            {years.length>0 ? years.map((y,i)=>(
              <tr key={i}>
                <td style={{fontWeight:800,color:'#0f172a'}}>{y}</td>
                <td style={{textAlign:'right'}}>
                  <div style={{display:'inline-flex',gap:'.3rem'}}>
                    <button className="btn-icon btn-edit" onClick={()=>{setEY(y);setYearN(y);}}><Ic.Edit/></button>
                    <button className="btn-icon btn-del" onClick={()=>setConf({catType:'years',id:y,name:y})}><Ic.Trash/></button>
                  </div>
                </td>
              </tr>
            )) : <tr><td colSpan={2} style={{textAlign:'center',padding:'2rem',color:'#cbd5e1',fontWeight:800,textTransform:'uppercase',fontSize:'.72rem'}}>No years added</td></tr>}
          </tbody>
        </table></div>
      </div>

    </> : <>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem',flexWrap:'wrap',gap:'.5rem'}}>
        <div>
          <div style={{fontWeight:900,fontSize:'1rem',color:'#0f172a'}}>
            {tab==='classes'?'Classes':tab==='clubs'?'Clubs':'Houses'}
          </div>
          <div style={{fontSize:'.65rem',color:'#94a3b8',fontWeight:700,marginTop:'.1rem'}}>
            {catList.length} {tab==='classes'?'class':tab==='clubs'?'club':'house'}{catList.length!==1?'es/s':''} · click any card to manage teachers
          </div>
        </div>
        <button className="btn btn-emerald btn-sm" onClick={()=>setCreating(tab)}>
          <Ic.Plus s={14}/>Create {tab==='classes'?'Class':tab==='clubs'?'Club':'House'}
        </button>
      </div>
      {catList.length===0
        ? <div className="card-xl"><div className="empty">
            <div className="empty-icon"><Ic.Plus s={26}/></div>
            <div className="empty-txt">No {tab} yet — click Create to add one</div>
          </div></div>
        : catList.map((item,i)=>(
            <CatCard key={item.id||i} item={item} type={tab}
              fbNode={tab==='classes'?'grades':tab==='clubs'?'clubs':'houses'}
              onDelete={()=>setConf({catType:tab,id:item.name,name:item.name})}
              showToast={showToast}/>
          ))
      }
    </>}

    {modal&&<div className="modal-bg">
      <div className="modal-box" style={{overflowY:'auto',maxHeight:'90vh'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}}>
          <h3 style={{fontSize:'1.2rem',fontWeight:900,color:'#0f172a'}}>{editing?'Edit Student':'New Student'}</h3>
          <button className="btn btn-ghost btn-icon" onClick={()=>setModal(false)}><Ic.X/></button>
        </div>
        <form onSubmit={submitStu}>
          <div style={{display:'flex',justifyContent:'center',marginBottom:'1rem'}}>
            <div style={{position:'relative',cursor:'pointer'}} onClick={()=>fileRef.current?.click()}>
              <img src={form.photoUrl||`https://ui-avatars.com/api/?name=${encodeURIComponent(form.name||'S')}&background=random`}
                style={{width:'5.5rem',height:'5.5rem',borderRadius:'1rem',objectFit:'cover',border:'2px solid #e2e8f0'}}/>
              <div style={{position:'absolute',bottom:'.2rem',right:'.2rem',background:'#4f46e5',borderRadius:'.375rem',padding:'.2rem',color:'white'}}><Ic.Edit s={11}/></div>
            </div>
            <input type="file" ref={fileRef} accept="image/*" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(f){const r=new FileReader();r.onloadend=()=>setForm({...form,photoUrl:r.result});r.readAsDataURL(f);}}}/>
          </div>
          <div className="form-grid">
            <TxtIn label="Index Number" value={form.indexNo} onChange={v=>setForm({...form,indexNo:v})} placeholder="STD/25/001" required/>
            <TxtIn label="Full Name" value={form.name} onChange={v=>setForm({...form,name:v})} placeholder="Legal name" required/>
            <Field label="Academic Year">
              <select className="inp" value={form.academicYear||selYear} onChange={e=>setForm({...form,academicYear:e.target.value})} style={{cursor:'pointer'}}>
                {years.length>0?years.map(y=><option key={y} value={y}>{y}</option>):<option value={selYear}>{selYear}</option>}
              </select>
            </Field>
            <Field label="Grade / Class">
              <select className="inp" value={form.grade||''} onChange={e=>setForm({...form,grade:e.target.value})} style={{cursor:'pointer'}}>
                <option value="">Select grade…</option>
                {grades.map(g=><option key={g.name} value={g.name}>{g.name}</option>)}
              </select>
            </Field>
            <TxtIn label="National ID" value={form.idNo} onChange={v=>setForm({...form,idNo:v})} placeholder="NIC / Reg No"/>
            <SelIn label="Gender" value={form.gender} onChange={v=>setForm({...form,gender:v})} options={['Male','Female','Other']}/>
            <Field label="Club">
              <select className="inp" value={form.club||''} onChange={e=>setForm({...form,club:e.target.value})} style={{cursor:'pointer'}}>
                <option value="">None</option>
                {clubs.map(c=><option key={c.name} value={c.name}>{c.name}</option>)}
              </select>
            </Field>
            <Field label="House">
              <select className="inp" value={form.house||''} onChange={e=>setForm({...form,house:e.target.value})} style={{cursor:'pointer'}}>
                <option value="">None</option>
                {houses.map(h=><option key={h.name} value={h.name}>{h.name}</option>)}
              </select>
            </Field>
            <TxtIn label="Date of Birth" value={form.dob} onChange={v=>setForm({...form,dob:v})} type="date"/>
            <TxtIn label="Email" value={form.email} onChange={v=>setForm({...form,email:v})} type="email" placeholder="student@school.edu"/>
            <TxtIn label="Phone" value={form.phone} onChange={v=>setForm({...form,phone:v})} placeholder="+960 xxx xxxx"/>
            <TxtIn label="Parent / Guardian" value={form.parentName} onChange={v=>setForm({...form,parentName:v})} placeholder="Parent name"/>
            <div className="col2">
              <label className="lbl">Address</label>
              <textarea className="inp" value={form.address||''} onChange={e=>setForm({...form,address:e.target.value})} placeholder="Permanent address" style={{minHeight:'72px',resize:'vertical'}}/>
            </div>
          </div>
          <button type="submit" className="btn btn-indigo w-full" style={{justifyContent:'center',padding:'.8rem',marginTop:'1rem',fontSize:'.78rem',textTransform:'uppercase',letterSpacing:'.08em'}}>
            {editing?'Save Changes':'Register Student'}
          </button>
        </form>
      </div>
    </div>}
  </div>;
};

// ── Super Admin ──────────────────────────────────────────
const SuperView = ({logs,onSetAdminPass,onSetSuperPass,onWipe,onWipeYear,onRestore,students,grades,clubs,houses,years,selYear,showToast}) => {
  const [newAP,setNAP]      = React.useState('');
  const [newSP,setNSP]      = React.useState('');
  const [wipeMode,setWM]    = React.useState(null);
  const [wipeYear,setWY]    = React.useState('');
  const [wiping,setWiping]  = React.useState(false);
  const [restoreD,setRD]    = React.useState(null);
  const [delS,setDelS]      = React.useState(null);
  const fileRef = React.useRef();

  const yearCounts = React.useMemo(()=>{
    const c={};
    students.forEach(s=>{ const y=s.academicYear||'unknown'; c[y]=(c[y]||0)+1; });
    return c;
  },[students]);

  const exportBk = ()=>{
    const b=new Blob([JSON.stringify({students,grades,clubs,houses,years},null,2)],{type:'application/json'});
    const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`backup_${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(u);
    showToast('Backup exported','success');
  };
  const importBk = e=>{
    const f=e.target.files?.[0];if(!f)return;
    const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.students)setRD(d);else showToast('Invalid backup','error');}catch{showToast('Read failed','error');}};
    r.readAsText(f);if(fileRef.current)fileRef.current.value='';
  };

  const doWipe = async ()=>{
    setWiping(true);
    try{
      if(wipeMode==='all'){await onWipe();showToast('All data wiped','success');}
      else {await onWipeYear(wipeYear);showToast(`${wipeYear} data deleted (${yearCounts[wipeYear]||0} students)`,'success');}
      setWM(null); setWY('');
    }catch(e){showToast('Wipe failed: '+e.message,'error');}
    setWiping(false);
  };

  return <div className="super-bg">
    {wipeMode&&<div className="wipe-bg">
      <div className="wipe-box" style={{maxWidth:'400px'}}>
        <div style={{textAlign:'center',marginBottom:'1.5rem'}}>
          <div style={{fontSize:'2.5rem',marginBottom:'.75rem'}}>🗑️</div>
          <div style={{color:'white',fontWeight:900,fontSize:'1.2rem',marginBottom:'.4rem'}}>
            {wipeMode==='all' ? 'Wipe All Data?' : `Delete ${wipeYear} Data?`}
          </div>
          <div style={{color:'#94a3b8',fontSize:'.85rem'}}>
            {wipeMode==='all'
              ? `This will permanently delete ALL ${students.length} students.`
              : `This will permanently delete ${yearCounts[wipeYear]||0} students from ${wipeYear}.`}
          </div>
        </div>
        <div style={{display:'flex',gap:'.625rem'}}>
          <button onClick={()=>{setWM(null);}}
            style={{flex:1,padding:'.875rem',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.15)',borderRadius:'.875rem',color:'white',fontWeight:800,cursor:'pointer',fontSize:'.82rem',textTransform:'uppercase'}}>
            Cancel
          </button>
          <button onClick={doWipe} disabled={wiping}
            style={{flex:1,padding:'.875rem',background:'linear-gradient(135deg,#dc2626,#991b1b)',border:'none',borderRadius:'.875rem',color:'white',fontWeight:800,cursor:'pointer',fontSize:'.82rem',textTransform:'uppercase',display:'flex',alignItems:'center',justifyContent:'center',gap:'.4rem'}}>
            {wiping
              ? <><div style={{width:'14px',height:'14px',border:'2px solid white',borderTopColor:'transparent',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>Deleting…</>
              : <><Ic.Trash s={14}/>{wipeMode==='all'?'Yes, Delete All':'Yes, Delete'}</>}
          </button>
        </div>
      </div>
    </div>}

    {delS&&<div className="modal-bg">
      <div className="modal-box modal-sm" style={{textAlign:'center'}}>
        <div style={{width:'3rem',height:'3rem',background:'#fef2f2',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto .75rem',color:'#dc2626'}}><Ic.Trash s={20}/></div>
        <h3 style={{fontSize:'1rem',fontWeight:900,color:'#0f172a',marginBottom:'.4rem'}}>Delete Student</h3>
        <p style={{color:'#64748b',fontSize:'.85rem',marginBottom:'1.25rem'}}>Remove <strong>{delS.name}</strong>?</p>
        <div style={{display:'flex',gap:'.625rem'}}>
          <button className="btn btn-ghost w-full" style={{justifyContent:'center',padding:'.7rem'}} onClick={()=>setDelS(null)}>Cancel</button>
          <button className="btn btn-red w-full" style={{justifyContent:'center',padding:'.7rem'}} onClick={async()=>{await fbDEL('students/'+delS.id);showToast('Deleted','success');setDelS(null);}}><Ic.Trash s={13}/>Delete</button>
        </div>
      </div>
    </div>}

    {restoreD&&<div className="modal-bg">
      <div className="modal-box modal-sm" style={{textAlign:'center'}}>
        <h3 style={{fontSize:'1rem',fontWeight:900,color:'#0f172a',marginBottom:'.4rem'}}>Restore Database</h3>
        <p style={{color:'#64748b',fontSize:'.85rem',marginBottom:'1.25rem'}}>Overwrite with <strong>{restoreD.students?.length||0} students</strong> from backup?</p>
        <div style={{display:'flex',gap:'.625rem'}}>
          <button className="btn btn-ghost w-full" style={{justifyContent:'center',padding:'.7rem'}} onClick={()=>setRD(null)}>Cancel</button>
          <button className="btn btn-indigo w-full" style={{justifyContent:'center',padding:'.7rem'}} onClick={()=>{onRestore(restoreD);setRD(null);showToast('Restored','success');}}>Restore</button>
        </div>
      </div>
    </div>}

    <input type="file" ref={fileRef} className="hidden" accept=".json" onChange={importBk}/>

    <div className="super-card" style={{padding:'1.25rem',marginBottom:'1rem',display:'flex',alignItems:'center',gap:'.875rem',flexWrap:'wrap'}}>
      <div style={{width:'3rem',height:'3rem',background:'linear-gradient(135deg,#6366f1,#4f46e5)',borderRadius:'.875rem',display:'flex',alignItems:'center',justifyContent:'center',color:'white'}}><Ic.Lock s={22}/></div>
      <div>
        <div style={{color:'white',fontWeight:900,fontSize:'1.2rem'}}>Super Admin</div>
        <div style={{display:'flex',alignItems:'center',gap:'.4rem'}}>
          <span className="live-badge"><span className="live-dot"/>Live</span>
          <span style={{color:'rgba(255,255,255,.4)',fontSize:'.68rem',fontWeight:700}}>{students.length} students total</span>
        </div>
      </div>
    </div>

    <div style={{background:'rgba(220,38,38,.08)',border:'1px solid rgba(220,38,38,.2)',borderRadius:'1.25rem',padding:'1.25rem',marginBottom:'1rem'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:'.625rem',marginBottom:'1rem'}}>
        <div>
          <div style={{color:'#f87171',fontWeight:900,fontSize:'.9rem'}}>🗑 Delete Student Data</div>
          <div style={{color:'rgba(248,113,113,.6)',fontSize:'.72rem'}}>{students.length} total students across {Object.keys(yearCounts).length} year{Object.keys(yearCounts).length!==1?'s':''}</div>
        </div>
        <button onClick={()=>setWM('all')}
          style={{background:'linear-gradient(135deg,#dc2626,#991b1b)',color:'white',border:'none',borderRadius:'.75rem',padding:'.6rem 1.1rem',fontSize:'.72rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em',cursor:'pointer',display:'flex',alignItems:'center',gap:'.4rem'}}>
          <Ic.Trash s={13}/>Wipe All Data
        </button>
      </div>
      {Object.keys(yearCounts).length===0
        ? <div style={{textAlign:'center',padding:'1.25rem',color:'rgba(255,255,255,.25)',fontSize:'.72rem',fontWeight:800,textTransform:'uppercase'}}>No students in database</div>
        : <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:'.625rem',marginBottom:'1rem'}}>
            {Object.entries(yearCounts).sort().map(([year,count])=>(
              <div key={year} style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:'.875rem',padding:'.875rem',display:'flex',flexDirection:'column',gap:'.5rem'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <div style={{color:'white',fontWeight:900,fontSize:'.9rem'}}>{year}</div>
                  <span style={{background:'rgba(220,38,38,.2)',color:'#f87171',fontSize:'.62rem',fontWeight:800,padding:'.15rem .5rem',borderRadius:'999px',border:'1px solid rgba(220,38,38,.3)'}}>{count} students</span>
                </div>
                <button onClick={()=>{setWM('year');setWY(year);}}
                  style={{flex:1,background:'rgba(220,38,38,.15)',color:'#f87171',border:'1px solid rgba(220,38,38,.25)',borderRadius:'.5rem',padding:'.4rem .5rem',fontSize:'.65rem',fontWeight:800,cursor:'pointer',textTransform:'uppercase',display:'flex',alignItems:'center',justifyContent:'center',gap:'.25rem'}}>
                  <Ic.Trash s={11}/>Delete {year}
                </button>
              </div>
            ))}
          </div>
      }
      {Object.entries(yearCounts).sort().map(([year,count])=>{
        const yrStudents = students.filter(s=>String(s.academicYear)===String(year));
        return <details key={year} style={{marginBottom:'.4rem'}}>
          <summary style={{cursor:'pointer',padding:'.5rem .75rem',background:'rgba(255,255,255,.04)',borderRadius:'.625rem',color:'#94a3b8',fontSize:'.72rem',fontWeight:700,listStyle:'none',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span>▶ View {year} students ({count})</span>
          </summary>
          <div style={{marginTop:'.4rem',maxHeight:'200px',overflowY:'auto',display:'flex',flexDirection:'column',gap:'.3rem'}}>
            {yrStudents.map(s=><div key={s.id} className="del-row">
              <div style={{display:'flex',alignItems:'center',gap:'.5rem',minWidth:0}}>
                <img src={s.photoUrl||`https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=random`} style={{width:'1.75rem',height:'1.75rem',borderRadius:'.4rem',objectFit:'cover',flexShrink:0}}/>
                <div style={{minWidth:0}}>
                  <div style={{color:'white',fontWeight:800,fontSize:'.8rem',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{s.name}</div>
                  <div style={{color:'rgba(255,255,255,.4)',fontSize:'.65rem',fontFamily:'monospace'}}>{s.indexNo}</div>
                </div>
              </div>
              <button onClick={()=>setDelS(s)} style={{background:'rgba(220,38,38,.2)',color:'#f87171',border:'1px solid rgba(220,38,38,.3)',borderRadius:'.4rem',padding:'.25rem .5rem',fontSize:'.65rem',fontWeight:800,textTransform:'uppercase',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>Delete</button>
            </div>)}
          </div>
        </details>;
      })}
    </div>

    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:'1rem',marginBottom:'1rem'}}>
      <div className="super-card" style={{padding:'1.25rem'}}>
        <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'1rem'}}><Ic.Key s={18}/><span style={{color:'white',fontWeight:900,fontSize:'.9rem'}}>Credentials</span></div>
        {[['Admin Key',newAP,setNAP,onSetAdminPass],['Super Key',newSP,setNSP,onSetSuperPass]].map(([l,v,sv,fn])=>(
          <div key={l} style={{marginBottom:'.875rem'}}>
            <div style={{color:'rgba(255,255,255,.45)',fontSize:'.62rem',fontWeight:800,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:'.3rem'}}>{l}</div>
            <div style={{display:'flex',gap:'.4rem'}}>
              <input className="super-inp" type="text" value={v} onChange={e=>sv(e.target.value)} placeholder="New key…" style={{flex:1,fontSize:'.85rem'}}/>
              <button onClick={()=>{if(v){fn(v);sv('');showToast(l+' updated','success');}}} style={{background:'linear-gradient(135deg,#6366f1,#4f46e5)',border:'none',borderRadius:'.5rem',padding:'0 .75rem',color:'white',fontWeight:800,fontSize:'.72rem',cursor:'pointer',height:'44px'}}>Save</button>
            </div>
          </div>
        ))}
      </div>
      <div className="super-card" style={{padding:'1.25rem'}}>
        <div style={{display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'1rem'}}><Ic.Activity s={18}/><span style={{color:'white',fontWeight:900,fontSize:'.9rem'}}>Audit Log</span></div>
        <div style={{maxHeight:'200px',overflowY:'auto',display:'flex',flexDirection:'column',gap:'.4rem'}}>
          {logs.length===0 ? <div style={{textAlign:'center',padding:'1.5rem',color:'rgba(255,255,255,.2)',fontSize:'.72rem',fontWeight:800,textTransform:'uppercase'}}>No logs yet</div>
          : logs.map(log=><div key={log.id} style={{background:'rgba(255,255,255,.04)',border:'1px solid rgba(255,255,255,.07)',borderRadius:'.625rem',padding:'.6rem .75rem'}}>
            <div style={{color:'white',fontWeight:700,fontSize:'.78rem'}}>{log.action}</div>
            <div style={{color:'rgba(255,255,255,.35)',fontSize:'.62rem',marginTop:'.2rem'}}>{new Date(log.timestamp).toLocaleString()}</div>
          </div>)}
        </div>
      </div>
    </div>

    <div className="super-card" style={{padding:'1.25rem',display:'flex',alignItems:'center',flexWrap:'wrap',gap:'.875rem',justifyContent:'space-between'}}>
      <div><div style={{color:'white',fontWeight:900,fontSize:'.875rem'}}>Backup & Restore</div><div style={{color:'rgba(255,255,255,.4)',fontSize:'.72rem'}}>Export or restore full JSON backup</div></div>
      <div style={{display:'flex',gap:'.5rem',flexWrap:'wrap'}}>
        <button onClick={exportBk} style={{background:'linear-gradient(135deg,#6366f1,#4f46e5)',border:'none',borderRadius:'.625rem',padding:'.65rem 1.1rem',color:'white',fontWeight:800,fontSize:'.72rem',textTransform:'uppercase',cursor:'pointer',display:'flex',alignItems:'center',gap:'.35rem'}}><Ic.Download s={13}/>Export</button>
